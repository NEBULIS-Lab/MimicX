[project]
name = "mimicx"
version = "0.4.1"
description = "Policy-in-the-loop supervision refinement for video-driven humanoid motion tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "PyYAML>=6", "tqdm>=4.65"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]
artifacts = ["huggingface-hub>=0.24,<2"]
visualization = ["imageio[ffmpeg]>=2.31", "Pillow>=10"]
physics = ["mujoco==3.5.0"]
plots = ["matplotlib>=3.7"]
website = ["playwright>=1.50,<2", "RangeHTTPServer==1.4.0"]

[project.urls]
Repository = "https://github.com/NEBULIS-Lab/MimicX"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mimicx*"]

[tool.setuptools.package-data]
mimicx = ["configs/paper/*.json", "configs/paper/methods/*.yaml", "configs/releases/*.json", "configs/datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
